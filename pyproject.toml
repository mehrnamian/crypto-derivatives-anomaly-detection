[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "derivs-anomaly"
version = "0.1.0"
description = "Local pipeline for detecting anomalies in BTCUSDT perpetual-market data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pandas>=2.2.0",
  "plotly>=5.24.0",
  "pyarrow>=17.0.0",
  "duckdb>=1.1.0",
  "numpy>=2.0.0",
  "scikit-learn>=1.5.0",
  "structlog>=24.4.0",
  "websockets>=13.0",
  "httpx>=0.27.0",
  "streamlit>=1.39.0",
  "joblib>=1.4.0",
  "python-dotenv>=1.0.0",
  "pandera[pandas]>=0.20.0",
  "fastavro>=1.9.0",
  "azure-eventhub>=5.12.0",
  "azure-identity>=1.17.0",
  "azure-storage-file-datalake>=12.16.0",
  "mlflow>=2.17.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "httpx>=0.27.0",
]

[project.scripts]
derivs-anomaly = "derivs_anomaly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
