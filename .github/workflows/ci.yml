name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Bicep build
        run: |
          az bicep build --file infra/main.bicep --outfile /tmp/derivs-main.json
          az bicep build --file infra/subscription-budget.bicep --outfile /tmp/derivs-budget.json
      - name: Build container image
        run: docker build --tag derivs-anomaly:${{ github.sha }} .
